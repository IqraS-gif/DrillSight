<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background modern dark slate gradient for crisp contrast on light/dark browser tabs -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="100%" stop-color="#070d18" />
    </linearGradient>
    
    <!-- Yellow / Industrial Gold Gradients -->
    <linearGradient id="yellowBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Blue / Petroleum Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blueDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ee" />
      <stop offset="100%" stop-color="#034694" />
    </linearGradient>
    
    <filter id="crestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- High-contrast rounded squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle inner neon perimeter -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#blueGlow)" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- DrillBit 3D Faceted Emblem in Yellow & Blue -->
  <g filter="url(#crestGlow)">
    <!-- Top Right Facet (Bright Yellow) -->
    <polygon points="32,9 53,31 32,23" fill="url(#yellowBright)" />
    
    <!-- Top Left Facet (Deep Gold Amber) -->
    <polygon points="32,9 32,23 11,31" fill="url(#goldDeep)" />

    <!-- Bottom Right Facet (Deep Royal Blue) -->
    <polygon points="32,23 53,31 41,53 32,43" fill="url(#blueDeep)" />
    
    <!-- Bottom Left Facet (Electric Sky Blue) -->
    <polygon points="32,23 32,43 23,53 11,31" fill="url(#blueGlow)" />

    <!-- Center Precision Spire / Drill Tip (Luminous Dual-Tone Core) -->
    <polygon points="32,13 35.5,31 32,55 28.5,31" fill="#ffffff" opacity="0.9" />
    <polygon points="32,13 35.5,31 32,55" fill="url(#yellowBright)" opacity="0.85" />
    <polygon points="32,31 28.5,31 32,55" fill="url(#blueGlow)" opacity="0.85" />
    
    <!-- Crown & Base Accents -->
    <circle cx="32" cy="9" r="2.2" fill="#fef08a" />
    <circle cx="32" cy="55" r="2.2" fill="#38bdf8" />
  </g>
</svg>